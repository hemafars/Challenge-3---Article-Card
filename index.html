<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge 3 — Article Card</title>
  <style>
    .container {
      width: fit-content;
    }

    .card {
      border: 1px solid black;
      margin: 1rem;
      padding: 1rem;
      text-align: center;
      box-shadow: 0px 5px 10px black;
      transition: 0.3s;
    }

    .card:hover {
      transform: translatey(-10px);

    }

    .text {
      text-align: justify;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.3;
      letter-spacing: 1px
    }

    img {
      max-width: 100%;
      width: 100%;
      object-fit: cover;
      height: 200px;
    }

    a:hover {
      color: red;
    }

    h2::before {
      content: '+';
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <img src="./img/pexels-markus-winkler-1430818-30869078.jpg" alt="">
      <div class="text">
        <h2>TECHNOLOGY</h2>
        <p>How to Become a Front-End Developer</p>
        <p>Learn HTML, CSS and JavaScript step by step.</p>
      </div>


      <span>Ahmed Fars</span> <span>5 min read</span>
      <a href="#">Read More</a>
    </div>

  </div>
</body>

</html>
